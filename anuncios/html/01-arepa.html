<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Anuncio 01 — Arepa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #12261F; }
    .ad {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      font-family: Outfit, sans-serif;
      color: #1A1A16;
    }
    .photo {
      position: absolute;
      inset: 0 0 470px 0;
      background: #1B3A2F url("../imagenes/bases/arepa.jpg") center 35% / cover no-repeat;
    }
    .photo::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0; height: 90px;
      background: #F6F0E4;
    }
    .kicker {
      position: absolute;
      top: 44px; left: 48px;
      background: #F6F0E4;
      color: #1B3A2F;
      letter-spacing: 0.28em;
      font-size: 18px;
      font-weight: 600;
      padding: 10px 18px;
    }
    .card {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 520px;
      background: #F6F0E4;
      padding: 28px 56px 48px;
    }
    .hook {
      font-family: Fraunces, serif;
      font-weight: 650;
      font-size: 64px;
      line-height: 1.05;
      color: #12261F;
      max-width: 960px;
    }
    .hook em {
      font-style: italic;
      color: #C45C3A;
      font-weight: 650;
    }
    .sub {
      margin-top: 18px;
      font-size: 30px;
      color: #3D4A44;
      font-weight: 400;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid #C4A46A;
    }
    .seal {
      font-size: 22px;
      font-weight: 500;
      color: #1B3A2F;
    }
    .price { text-align: right; }
    .old {
      font-size: 22px;
      color: #8A7E6C;
      text-decoration: line-through;
      margin-right: 12px;
    }
    .now {
      font-family: Fraunces, serif;
      font-size: 56px;
      font-weight: 700;
      color: #C45C3A;
    }
  </style>
</head>
<body>
  <article class="ad">
    <div class="photo"></div>
    <div class="kicker">MESA SERENA</div>
    <div class="card">
      <h1 class="hook">Te dijeron que se acabó la arepa.<br /><em>Te mintieron a medias.</em></h1>
      <p class="sub">Arepa pequeña. Sin jugo. Recetario criollo para diabetes.</p>
      <div class="row">
        <p class="seal">50 recetas · Venezuela · todos los bolsillos</p>
        <p class="price"><span class="now">9 USD</span></p>
      </div>
    </div>
  </article>
</body>
</html>
