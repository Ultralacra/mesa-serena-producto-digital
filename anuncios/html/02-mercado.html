<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Anuncio 02 — Mercado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #12261F; }
    .ad {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      font-family: Outfit, sans-serif;
      color: #1A1A16;
    }
    .photo {
      position: absolute;
      inset: 0 0 500px 0;
      background: #1B3A2F url("../imagenes/bases/mercado.jpg") center 40% / cover no-repeat;
    }
    .kicker {
      position: absolute;
      top: 44px; left: 48px;
      background: #1B3A2F;
      color: #F6F0E4;
      letter-spacing: 0.28em;
      font-size: 18px;
      font-weight: 600;
      padding: 10px 18px;
    }
    .card {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 560px;
      background: #1B3A2F;
      color: #F6F0E4;
      padding: 40px 56px 48px;
    }
    .hook {
      font-family: Fraunces, serif;
      font-weight: 650;
      font-size: 58px;
      line-height: 1.08;
    }
    .hook em { font-style: italic; color: #E8C9A8; }
    .sub {
      margin-top: 18px;
      font-size: 28px;
      color: #D5DDD6;
      max-width: 900px;
    }
    .pills {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    .pills span {
      border: 1px solid #C4A46A;
      color: #F6F0E4;
      padding: 8px 16px;
      font-size: 20px;
      letter-spacing: 0.04em;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 34px;
      padding-top: 26px;
      border-top: 1px solid #C4A46A;
    }
    .seal { font-size: 22px; color: #E8C9A8; }
    .now {
      font-family: Fraunces, serif;
      font-size: 56px;
      font-weight: 700;
      color: #F6F0E4;
    }
    .now small {
      font-family: Outfit, sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: #C4A46A;
      margin-right: 10px;
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <article class="ad">
    <div class="photo"></div>
    <div class="kicker">MESA SERENA</div>
    <div class="card">
      <h1 class="hook">Esto no es un recetario de Miami.<br /><em>Es de tu mercado.</em></h1>
      <p class="sub">30 recetas con huevo, pollo, caraota y auyama. 14 cuando alcanza. 6 para el domingo.</p>
      <div class="pills">
        <span>Diario</span>
        <span>Cómodo</span>
        <span>Elevado</span>
      </div>
      <div class="row">
        <p class="seal">Para todos los bolsillos</p>
        <p class="now">9 USD</p>
      </div>
    </div>
  </article>
</body>
</html>
