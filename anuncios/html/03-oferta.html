<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Anuncio 03 — Oferta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #12261F; }
    .ad {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      font-family: Outfit, sans-serif;
      color: #1A1A16;
    }
    .photo {
      position: absolute;
      inset: 0 0 540px 0;
      background: #1B3A2F url("../imagenes/bases/oferta.jpg") center 45% / cover no-repeat;
    }
    .badge {
      position: absolute;
      top: 44px; right: 48px;
      background: #C45C3A;
      color: #FFFBF4;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.08em;
      padding: 12px 18px;
    }
    .kicker {
      position: absolute;
      top: 44px; left: 48px;
      background: #F6F0E4;
      color: #1B3A2F;
      letter-spacing: 0.28em;
      font-size: 18px;
      font-weight: 600;
      padding: 10px 18px;
    }
    .card {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 600px;
      background: #F6F0E4;
      padding: 36px 56px 48px;
    }
    .hook {
      font-family: Fraunces, serif;
      font-weight: 650;
      font-size: 58px;
      line-height: 1.08;
      color: #12261F;
    }
    .sub {
      margin-top: 16px;
      font-size: 28px;
      color: #3D4A44;
    }
    .list {
      margin-top: 22px;
      font-size: 24px;
      color: #1B3A2F;
      line-height: 1.55;
    }
    .row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #C4A46A;
    }
    .cta {
      font-size: 22px;
      font-weight: 600;
      color: #1B3A2F;
    }
    .price-box { text-align: right; }
    .old {
      display: block;
      font-size: 20px;
      color: #8A7E6C;
      text-decoration: line-through;
    }
    .now {
      font-family: Fraunces, serif;
      font-size: 64px;
      font-weight: 700;
      color: #C45C3A;
      line-height: 1;
    }
  </style>
</head>
<body>
  <article class="ad">
    <div class="photo"></div>
    <div class="kicker">MESA SERENA</div>
    <div class="badge">LANZAMIENTO</div>
    <div class="card">
      <h1 class="hook">Un solo menú.<br />Toda la casa come.</h1>
      <p class="sub">Tú tu porción. Ellos, rico. Sin plato de enferma.</p>
      <p class="list">
        50 recetas criollas para diabetes<br />
        Menú de 7 días · Lista de mercado · Guía de la arepa
      </p>
      <div class="row">
        <p class="cta">PDF al correo, al pagar.</p>
        <div class="price-box">
          <span class="now">9 USD</span>
        </div>
      </div>
    </div>
  </article>
</body>
</html>
